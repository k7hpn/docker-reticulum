name: container-image
run-name: ${{ github.actor }} is running container-image

on: [push, pull_request]

permissions:
  packages: read,write

jobs:
  build-container-image:
    name: "reticulum container"
    runs-on: ubuntu-latest

    steps:
      - name: "checkout code"
        uses: actions/checkout@v7
      
      - name: "authenticate with dhi.io container registry"
        uses: docker/login-action@v4
        with:
          registry: ${{ vars.dhi_container_host }}
          username: ${{ vars.dhi_container_actor }}
          password: ${{ secrets.dhi_container_pat }}

      - name: "authenticate with gitea container registry"
        uses: docker/login-action@v4
        with:
          registry: ${{ vars.container_host }}
          username: ${{ vars.container_actor }}
          password: ${{ secrets.container_pat }}

      - name: "build image"
        run: docker build . --tag ${{ vars.container_host}}/${{ github.repository }}:latest

      - name: "push image"
        run: docker push ${{ vars.container_host}}/${{ github.repository }}:latest

